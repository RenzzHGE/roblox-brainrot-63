<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas><script>
var gl = document.getElementById('c').getContext('webgl2') || document.getElementById('c').getContext('webgl');
if (!gl) { document.title = 'NO_WEBGL'; } else {
  gl.clearColor(1, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); document.title = 'WEBGL_OK';
}
</script></body></html>
