<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#87a5d6}</style></head>
<body><script>window.onerror=function(m,s,l){document.title='ERR:'+m+' @'+l;};</script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
try {
const r = new THREE.WebGLRenderer({antialias:true});
r.setSize(1280,720); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x87a5d6);
s.add(new THREE.HemisphereLight(0xffffff,0x445566,1.2));
const d = new THREE.DirectionalLight(0xffffff,2); d.position.set(5,10,7); s.add(d);
const g = new THREE.Mesh(new THREE.BoxGeometry(20,1,20), new THREE.MeshStandardMaterial({color:0x4a8a3a}));
g.position.y=-1; s.add(g);
const b = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color:0xc05050}));
b.position.set(0,1,0); s.add(b);
const c = new THREE.PerspectiveCamera(50,1280/720,0.1,200); c.position.set(6,4,8); c.lookAt(0,0.5,0);
r.render(s,c); document.title='RENDERED';
} catch(e) { document.title='CATCH:'+e.message; }
</script></body></html>
